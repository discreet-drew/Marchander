<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Marchander</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="hero">

        <h1>🛒 Marchander</h1>

        <p>
            Compare prices across stores instantly
        </p>

        <div class="search-box">

            <input
                id="query"
                type="text"
                placeholder="Search for a product...">

            <button
                onclick="searchProduct()">

                Search

            </button>

        </div>

    </div>

    <div id="loading"></div>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>

</html>
